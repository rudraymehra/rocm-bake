# sccache server configuration for ROCm/PyTorch builds
# Deploy: sudo cp /opt/sccache/sccache.conf /etc/default/sccache
#         sudo systemctl restart sccache
#
# Verify: sccache --show-stats
# Clear:  sccache --stop-server && sccache --start-server

# sccache server options
SCCACHE_OPTIONS="--start-server --cache-size=200G --log-file /var/log/sccache/sccache.log"

# Cache directory (local SSD on build machine)
SCCACHE_DIR=/var/cache/sccache

# Port for client connections
SCCACHE_SERVER_PORT=9000

# Resource limits
SCCACHE_MAX_MEMORY=4G
