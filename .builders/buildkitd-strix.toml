# Buildkit daemon configuration for SNOC Strix (gfx950, ROCm)
#
# For the docker-container driver (what `make builder-strix` does):
#   docker buildx create --name strix --driver docker-container \
#     --config .builders/buildkitd-strix.toml
# The config is baked in at create time — an existing builder does not
# pick up edits to this file. Recreate it: docker buildx rm strix.
#
# For standalone buildkitd on Think:
#   sudo cp buildkitd-strix.toml /etc/buildkit/buildkitd.toml
#   sudo systemctl restart buildkitd
#
# Only keys buildkitd actually understands belong here. Unknown keys are
# not inert: a containerd worker pointed at a bad address takes the whole
# daemon down in a 60-second restart loop.

[worker.oci]
  enabled = true
  platforms = ["linux/amd64"]
  # 10 of the 16 cores, leaving headroom for the host and display
  max-parallelism = 10
  gc = true
  gckeepstorage = "100GB"

[worker.oci.labels]
  "com.snoc.platform" = "strix-halo"
  "com.snoc.gpu" = "gfx950"

# The docker-container driver runs the OCI worker only. Enabling the
# containerd worker here points it at buildkitd's own socket and crashes
# the daemon on startup.
[worker.containerd]
  enabled = false

# The bare-metal zot on Strix (zot.service, port 8080). It serves plain
# HTTP on the tailnet, so buildkit needs http = true here or every pull
# and every cache export fails on the TLS handshake.
[registry."100.91.58.37:8080"]
  http = true
  insecure = true

# zot syncs library/**, rocm/**, moby/** and friends on demand, so point
# the upstreams at it rather than egressing for every layer.
[registry."docker.io"]
  mirrors = ["100.91.58.37:8080"]

[registry."ghcr.io"]
  mirrors = ["100.91.58.37:8080"]

[registry."quay.io"]
  mirrors = ["100.91.58.37:8080"]

# Prometheus metrics + pprof
[grpc]
  debugAddress = "0.0.0.0:6060"

# Not expressible here, despite earlier attempts in this file:
#   - Host mounts (/opt/rocm, /dev/kfd, /dev/dri, /var/cache/sccache).
#     buildkitd.toml has no `mount` key. Build steps get host paths via
#     `RUN --mount=` in the Dockerfile; device access during a build
#     needs an entitlement, and compiling for gfx950 does not need a GPU.
#   - Memory/CPU ceilings. Those are container limits — set them on the
#     builder container (docker update / --driver-opt) or in the
#     buildkitd.service unit for standalone mode.
