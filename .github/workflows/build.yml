name: Build & push — ROCm PyTorch

on:
  workflow_dispatch:
    inputs:
      rocm_version:
        description: 'ROCm base image tag (e.g. 10.1.0-full)'
        default: '10.1.0-full'
        required: false
      pytorch_version:
        description: 'PyTorch version (e.g. 2.14.1)'
        default: '2.14.1'
        required: false
      rocm_arch:
        description: 'ROCm architecture (e.g. gfx950;gfx942;gfx90a)'
        default: 'gfx950'
        required: false
      registry:
        description: 'Registry URL'
        default: 'snoc-strix.fold-leaffish.ts.net:8080'
        required: false
      push:
        description: 'Push to registry'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pytorch-test is left out: its stage exits 1 without /dev/kfd,
        # which no build step has (eddc857). make gpu-test covers it.
        target: [pytorch-base, pytorch, pytorch-run]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        if: inputs.push == true
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      # bake reads REGISTRY, PYTORCH_VERSION, ROCM_VERSION and
      # PYTORCH_ROCM_ARCH from these env vars (each is a bake variable), so
      # no --set is needed; the old "target.<name>.args" form was rejected.
      - name: Build ${{ matrix.target }}
        env:
          REGISTRY: ${{ inputs.registry }}
          PYTORCH_VERSION: ${{ inputs.pytorch_version }}
          ROCM_VERSION: ${{ inputs.rocm_version }}
          PYTORCH_ROCM_ARCH: ${{ inputs.rocm_arch }}
        run: |
          docker buildx bake \
            -f bake.hcl \
            ${{ matrix.target }}

      - name: Push ${{ matrix.target }}
        if: inputs.push == true
        env:
          REGISTRY: ${{ inputs.registry }}
          PYTORCH_VERSION: ${{ inputs.pytorch_version }}
          ROCM_VERSION: ${{ inputs.rocm_version }}
          PYTORCH_ROCM_ARCH: ${{ inputs.rocm_arch }}
        run: |
          docker buildx bake \
            -f bake.hcl \
            --push \
            ${{ matrix.target }}
