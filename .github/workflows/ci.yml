name: CI — Dockerfile & bake validation

on:
  pull_request:
    paths:
      - "bake.hcl"
      - "Dockerfile.*"
      - "Makefile"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "bake.hcl"
      - "Dockerfile.*"
      - "Makefile"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

# Validation only, no builds. A GitHub-hosted runner cannot reach the
# tailnet registry that every image but the base builds FROM, and the
# ROCm base alone does not fit its disk, so building here can only fail.
# These checks need neither: bake resolves every target without
# building, and BuildKit's checks read each Dockerfile with only its
# base images' metadata. Registry-only parents get public stand-ins.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: bake.hcl parses and every target resolves
        run: docker buildx bake -f bake.hcl --print default wheels pytorch-test > /dev/null

      # Two checks are skipped, each for a reason that holds only here:
      #   SecretsUsedInArgOrEnv  fires on the word KEY in
      #                          SCCACHE_WEBDAV_KEY_PREFIX, a cache path
      #                          prefix rather than a credential
      #   UndefinedVar           only where a stand-in parent is used: the
      #                          real parent (our base) defines variables
      #                          such as LD_LIBRARY_PATH that the public
      #                          stand-in does not. Dockerfile.base keeps it.
      - name: Dockerfile checks (BuildKit, no build)
        run: |
          rocm=rocm/dev-ubuntu-26.04:10.1.0-full
          check() { # check <skip-list> <Dockerfile> [build args...]
            echo "== $2"
            skip=$1 f=$2; shift 2
            docker buildx build --call check --platform linux/amd64 \
              --build-arg "BUILDKIT_DOCKERFILE_CHECK=skip=$skip" -f "$f" "$@" .
          }
          own=SecretsUsedInArgOrEnv
          standin=SecretsUsedInArgOrEnv,UndefinedVar
          check "$own" Dockerfile.base
          check "$standin" Dockerfile.pytorch --build-arg BASE_IMAGE="$rocm" --build-arg TRITON_WHEEL_IMAGE=busybox
          check "$standin" Dockerfile.triton --build-arg BASE_IMAGE="$rocm"
          check "$standin" Dockerfile.aiter --build-arg PYTORCH_IMAGE="$rocm" --build-arg TRITON_WHEEL_IMAGE=busybox
          check "$standin" Dockerfile.runtime --build-context pytorch=docker-image://busybox
