name: CI — Dockerfile & bake validation

on:
  pull_request:
    paths:
      - "bake.hcl"
      - "Dockerfile.*"
      - "Makefile"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "bake.hcl"
      - "Dockerfile.*"
      - "Makefile"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [pytorch-base, pytorch, pytorch-run, pytorch-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate bake.hcl target syntax
        run: |
          docker buildx bake -f bake.hcl --print \
            --set "*.platform=linux/amd64" \
            --set "${{ matrix.target }}.tags=test:latest"

      - name: Check Dockerfile syntax — base
        if: matrix.target == 'pytorch-base'
        run: docker build -f Dockerfile.base --progress=plain --target base .

      - name: Check Dockerfile syntax — pytorch (no network deps)
        if: matrix.target == 'pytorch'
        run: |
          docker build -f Dockerfile.pytorch \
            --progress=plain \
            --build-arg ROCM_VERSION=7.14 \
            --build-arg PYTORCH_VERSION=2.14.1 \
            --build-arg PYTORCH_ROCM_ARCH=gfx950 \
            --build-arg PYTHON_VERSION=3.14 \
            --target builder \
            --network=host \
            -t test-pytorch-builder .

      - name: Check Dockerfile syntax — runtime
        if: matrix.target == 'pytorch-run'
        run: docker build -f Dockerfile.runtime --progress=plain --target final .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HCL lint — bake.hcl
        uses: nicholarquinoh/hcledit-action@v1
        with:
          command: validate
          path: bake.hcl
